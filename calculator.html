<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة تقدير المواد | RBooSH™</title>
<link rel="icon" href="./Picsart_26-09-25_20-22-02-165.jpg">
<link rel="apple-touch-icon" href="./Picsart_26-09-25_20-22-02-165.jpg">
<meta property="og:image" content="https://rboosh.github.io/SY/Picsart_26-09-25_20-22-02-165.jpg">
<meta name="theme-color" content="#00bfff">
<style>
:root{--bg:#000;--card:#111;--card2:#0a0a0a;--text:#fff;--text2:#aaa;--border:#222;--blue:#00bfff;--blue2:#1e3a8a}
body.light{--bg:#f5f7fb;--card:#ffffff;--card2:#eef2ff;--text:#111827;--text2:#6b7280;--border:#dbe3ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.8;transition:0.4s}
.header-top{position:fixed;top:0;left:0;right:0;background:var(--bg);border-bottom:2px solid var(--blue2);padding:12px 15px;z-index:1000;display:flex;justify-content:space-between;align-items:center}
.menu-btn{font-size:28px;background:none;border:none;color:var(--blue);cursor:pointer}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer}
.container{max-width:600px;margin:0 auto;padding:20px;padding-top:90px}
.logo{text-align:center;margin:20px 0}.logo img{max-width:250px;width:100%;filter:drop-shadow(0 0 15px rgba(0,191,255,0.5))}
.calculator{background:var(--card);border:1px solid var(--border);padding:30px;border-radius:12px;box-shadow:0 0 20px rgba(0,191,255,0.1)}
h2{color:var(--blue);margin-bottom:10px;text-align:center}
.calc-form{display:flex;flex-direction:column;gap:15px;margin-top:20px}
.calc-form label{font-size:14px;color:var(--text2)}
.calc-form input,.calc-form select{padding:14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px}
.calc-form button{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:16px;transition:0.3s}
.calc-form button.whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);box-shadow:0 0 15px rgba(37,211,102,0.6)}
.calc-form button:hover{transform:translateY(-2px);box-shadow:0 0 20px rgba(0,191,255,0.4)}
.calc-result{background:var(--card2);border:1px solid var(--blue2);padding:20px;border-radius:10px;margin-top:20px}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100%;background:var(--card);border-left:2px solid var(--blue2);z-index:1001;transition:0.3s;padding:20px}.sidebar.open{right:0}
.sidebar a{display:block;padding:14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;z-index:1000}.overlay.show{display:block}
</style>
</head>
<body>
<div class="header-top"><button class="menu-btn" onclick="openMenu()">☰</button><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button></div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar"><button style="background:none;border:none;color:var(--text);font-size:24px;float:left;cursor:pointer" onclick="closeMenu()">×</button><h3 style="color:var(--blue);text-align:center;margin-bottom:20px;">القائمة</h3><a href="index.html">الرئيسية</a><a href="products.html">المنتجات 🛒</a><a href="calculator.html">الحاسبة</a></div>

<div class="container">
<div class="logo"><img src="logo.png" alt="RBooSH"></div>
<div class="calculator">
<h2>حاسبة تقدير المواد الكهربائية</h2>
<p style="text-align:center;color:var(--text2);font-size:14px;">احسب كمياتك التقريبية وارسلها مباشرة لواتساب سليمان</p>
<div class="calc-form">
<label>نوع المكان</label>
<select id="place_type"><option value="house">بيت سكني</option><option value="shop">محل تجاري</option><option value="factory">معمل / ورشة</option></select>
<label>المساحة بالمتر المربع</label>
<input type="number" id="area" placeholder="مثال: 150">
<label>عدد الغرف / الاقسام</label>
<input type="number" id="rooms" placeholder="مثال: 3">
<button onclick="calcOnly()">1. احسب الكميات</button>
<div id="result" class="calc-result" style="display:none;"></div>
<div id="contactBox" style="display:none;flex-direction:column;gap:15px;margin-top:10px;">
<label>اسمك</label><input type="text" id="c_name" placeholder="احمد محمد">
<label>رقم هاتفك</label><input type="tel" id="c_phone" placeholder="09xxxxxxxx">
<button onclick="sendToWhatsApp()" class="whatsapp">2. ارسال التفاصيل لواتساب سليمان</button>
</div>
</div>
</div>
</div>

<script>
function toggleTheme(){document.body.classList.toggle('light');let l=document.body.classList.contains('light');localStorage.setItem('rboosh_theme',l?'light':'dark');document.getElementById('themeBtn').innerText=l?'🌙':'☀️';}
(function(){let s=localStorage.getItem('rboosh_theme');if(s==='light'){document.body.classList.add('light');document.getElementById('themeBtn').innerText='🌙';}else{document.getElementById('themeBtn').innerText='☀️';}})();
function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
let lastCalc = {};
function calcOnly(){
let place = document.getElementById('place_type').value;
let area = document.getElementById('area').value;
let rooms = document.getElementById('rooms').value;
if(!area || !rooms){ alert("الرجاء ادخال المساحة وعدد الغرف"); return; }
let factor = place=="factory"?2.2: place=="shop"?1.6:1.3;
let placeName = place=="factory"?"معمل / ورشة": place=="shop"?"محل تجاري":"بيت سكني";
lastCalc = {
cable2_5: Math.round(area * factor),
cable4: Math.round(rooms * 30),
cable6: Math.round(rooms * 15),
breaker: Math.ceil(rooms / 2) + 3,
sockets: rooms * (place == "factory" ? 6 : 4),
switches: rooms * 2,
panels: place == "factory" ? 2 : 1,
placeName, area, rooms
};
document.getElementById('result').style.display = 'block';
document.getElementById('result').innerHTML = `
<h4>التقدير التقريبي لـ ${lastCalc.placeName}:</h4>
<p>- كابل 2.5mm: <b>${lastCalc.cable2_5} متر</b></p>
<p>- كابل 4mm: <b>${lastCalc.cable4} متر</b></p>
<p>- كابل 6mm: <b>${lastCalc.cable6} متر</b></p>
<p>- قواطع: <b>${lastCalc.breaker} حبة</b></p>
<p>- برايز: <b>${lastCalc.sockets} حبة</b></p>
<p>- مفاتيح: <b>${lastCalc.switches} حبة</b></p>
<p>- لوحات: <b>${lastCalc.panels} لوحة</b></p>
`;
document.getElementById('contactBox').style.display = 'flex';
}
function sendToWhatsApp(){
let name = document.getElementById('c_name').value;
let phone = document.getElementById('c_phone').value;
if(!name || !phone){ alert("الرجاء ادخال الاسم والرقم"); return; }
let message = `🔌 طلب تقدير جديد من حاسبة RBooSH%0A%0Aالاسم: ${name}%0Aالتلفون: ${phone}%0Aنوع المكان: ${lastCalc.placeName}%0Aالمساحة: ${lastCalc.area} متر%0Aعدد الغرف: ${lastCalc.rooms}%0A%0A*الكميات المطلوبة:*%0A- 2.5mm: ${lastCalc.cable2_5} متر%0A- 4mm: ${lastCalc.cable4} متر%0A- 6mm: ${lastCalc.cable6} متر%0A- قواطع: ${lastCalc.breaker} حبة%0A- برايز: ${lastCalc.sockets} حبة%0A- مفاتيح: ${lastCalc.switches} حبة%0A- لوحات: ${lastCalc.panels} لوحة`;
let whatsappNumber = "4915216839609";
window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
}
</script>
</body>
</html>
