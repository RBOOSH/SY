<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBooSH™ | Calculator</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; font-family:'Tahoma', sans-serif;}
  body{background:#000; color:#fff; line-height:1.8;}
  header{background:#000; border-bottom:2px solid #1e3a8a; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
  header.logo{font-size:24px; font-weight:bold; color:#1e3a8a;}
  header a{color:#aaa; text-decoration:none; font-size:14px;}

.lang-switch {display:flex; gap:8px;}
.lang-btn {background:#222; color:#aaa; border:1px solid #333; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:bold;}
.lang-btn.active {background:#1e3a8a; color:#fff; border-color:#1e3a8a;}

.container{max-width:650px; margin:30px auto; padding:20px;}
.calculator {background:#111; padding:30px; border-radius:16px; border:2px solid #1e3a8a;}
  h2{color:#1e3a8a; margin-bottom:10px; text-align:center; font-size:22px;}
.subtitle{text-align:center; color:#aaa; font-size:14px; margin-bottom:25px;}

.calc-form {display:flex; flex-direction:column; gap:18px;}
.calc-form label{font-size:14px; color:#aaa; text-align:right;}
  [dir="ltr"].calc-form label{text-align:left;}
.calc-form input,.calc-form select {
    padding:14px; border-radius:10px; border:1px solid #333;
    background:#0a0a0a; color:#fff; font-size:16px; width:100%; text-align:right;
  }
  [dir="ltr"].calc-form input, [dir="ltr"].calc-form select {text-align:left;}
.calc-form button {
    background:#1e3a8a; color:#fff; padding:16px; border:none;
    border-radius:10px; font-weight:bold; cursor:pointer; font-size:16px; margin-top:5px;
  }
.calc-form button.whatsapp {background:#25D366; margin-top:10px;}
.calc-form button:hover {opacity:0.9;}

.calc-result {
    background:#0a0a0a; border:1px solid #1e3a8a;
    padding:20px; border-radius:12px; margin-top:20px; text-align:right;
  }
  [dir="ltr"].calc-result {text-align:left;}
.calc-result h4{color:#1e3a8a; margin-bottom:10px;}
.calc-result p{margin:6px 0;}

.contact-section{
    border-top:1px dashed #333;
    padding-top:20px;
    margin-top:20px;
  }
  footer{text-align:center; padding:20px; color:#555; font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="logo">RBooSH™</div>
  <div style="display:flex; align-items:center; gap:15px;">
    <a href="index.html" id="back_link">← الرجوع للموقع الرئيسي</a>
    <div class="lang-switch">
      <button class="lang-btn active" onclick="setLang('ar')">عربي</button>
      <button class="lang-btn" onclick="setLang('en')">EN</button>
      <button class="lang-btn" onclick="setLang('ku')">Kurdî</button>
    </div>
  </div>
</header>

<div class="container">
  <div class="calculator">
    <h2 id="title">حاسبة تقدير المواد الكهربائية</h2>
    <p class="subtitle" id="subtitle">احسب كمياتك التقريبية وارسلها مباشرة لواتساب سليمان ربوشي</p>

    <div class="calc-form">
      <label id="label_place">نوع المكان</label>
      <select id="place_type">
        <option value="house" id="opt_house">بيت سكني</option>
        <option value="shop" id="opt_shop">محل تجاري</option>
        <option value="factory" id="opt_factory">معمل / ورشة</option>
      </select>

      <label id="label_area">المساحة بالمتر المربع</label>
      <input type="number" id="area" placeholder="مثال: 150">

      <label id="label_rooms">عدد الغرف / الاقسام</label>
      <input type="number" id="rooms" placeholder="مثال: 4">

      <button onclick="calcOnly()" id="btn_calc">1. احسب الكميات</button>

      <div id="result" class="calc-result" style="display:none;"></div>

      <div id="contactBox" class="contact-section" style="display:none;">
        <label id="label_name">اسمك</label>
        <input type="text" id="c_name" placeholder="اكتب اسمك هنا">

        <label id="label_phone">رقم هاتفك</label>
        <input type="tel" id="c_phone" placeholder="09xxxxxxxx">

        <button onclick="sendToWhatsApp()" class="whatsapp" id="btn_send">2. ارسال التفاصيل لواتساب سليمان ربوشي</button>
      </div>
    </div>
  </div>
</div>

<footer>
  © 2026 RBooSH™ | Qamişlo - Herêma Pîşesazî
</footer>

<script>
let currentLang = 'ar';
let lastCalc = {};

const translations = {
  ar: {
    dir: 'rtl', back: '← الرجوع للموقع الرئيسي', title: 'حاسبة تقدير المواد الكهربائية',
    subtitle: 'احسب كمياتك التقريبية وارسلها مباشرة لواتساب سليمان ربوشي',
    place: 'نوع المكان', house: 'بيت سكني', shop: 'محل تجاري', factory: 'معمل / ورشة',
    area: 'المساحة بالمتر المربع', area_ph: 'مثال: 150',
    rooms: 'عدد الغرف / الاقسام', rooms_ph: 'مثال: 4',
    calc: '1. احسب الكميات', name: 'اسمك', name_ph: 'اكتب اسمك هنا',
    phone: 'رقم هاتفك', phone_ph: '09xxxxxxxx',
    send: '2. ارسال التفاصيل لواتساب سليمان ربوشي',
    result_title: 'التقدير التقريبي لـ', cable: 'كابل', breaker: 'قواطع', socket: 'برايز', switch: 'مفاتيح', panel: 'لوحات', piece: 'حبة', meter: 'متر', panel_unit: 'لوحة',
    alert: 'الرجاء ادخال المساحة وعدد الغرف', alert2: 'الرجاء ادخال الاسم والرقم',
    whatsapp_msg: '🔌 طلب تقدير جديد من حاسبة RBooSH%0A%0Aالاسم: %NAME%%0Aالتلفون: %PHONE%%0Aنوع المكان: %PLACE%%0Aالمساحة: %AREA% متر%0Aعدد الغرف: %ROOMS%%0A%0A*الكميات المطلوبة:*%0A- 2.5mm: %C25% متر%0A- 4mm: %C4% متر%0A- 6mm: %C6% متر%0A- قواطع: %BR% حبة%0A- برايز: %SO% حبة%0A- مفاتيح: %SW% حبة%0A- لوحات: %PA% لوحة'
  },
  en: {
    dir: 'ltr', back: '← Back to Main Site', title: 'Electrical Materials Estimator',
    subtitle: 'Estimate your materials and send directly to Sulaiman Rbooshi on WhatsApp',
    place: 'Place Type', house: 'Residential House', shop: 'Commercial Shop', factory: 'Workshop / Factory',
    area: 'Area in Square Meters', area_ph: 'Ex: 150',
    rooms: 'Number of Rooms / Sections', rooms_ph: 'Ex: 4',
    calc: '1. Calculate Quantities', name: 'Your Name', name_ph: 'Enter your name',
    phone: 'Your Phone', phone_ph: '09xxxxxxxx',
    send: '2. Send Details to Sulaiman Rbooshi on WhatsApp',
    result_title: 'Estimated Materials for', cable: 'Cable', breaker: 'Breakers', socket: 'Sockets', switch: 'Switches', panel: 'Panels', piece: 'pcs', meter: 'm', panel_unit: 'panel',
    alert: 'Please enter area and number of rooms', alert2: 'Please enter name and phone',
    whatsapp_msg: '🔌 New Estimate Request from RBooSH Calculator%0A%0AName: %NAME%%0APhone: %PHONE%%0APlace Type: %PLACE%%0AArea: %AREA% m2%0ANo. of Rooms: %ROOMS%%0A%0A*Required Materials:*%0A- 2.5mm Cable: %C25% m%0A- 4mm Cable: %C4% m%0A- 6mm Cable: %C6% m%0A- Breakers: %BR% pcs%0A- Sockets: %SO% pcs%0A- Switches: %SW% pcs%0A- Panels: %PA% panel'
  },
  ku: {
    dir: 'ltr', back: '← Vegerin bo Malpera Sereke', title: 'Hesabkera Texmîna Materyalên Elektrîkê',
    subtitle: 'Materyalên xwe texmîn bikin û rasterast bişînin WhatsApp a Sulaiman Rbooshi',
    place: 'Cureyê Cihê', house: 'Xaniyê Niștecihî', shop: 'Dûkan', factory: 'Kargeh / Atolyê',
    area: 'Rûber bi Metre Çargoşe', area_ph: 'Mînak: 150',
    rooms: 'Hejmara Jûran / Beşan', rooms_ph: 'Mînak: 4',
    calc: '1. Hejmaran Hesab Bikin', name: 'Navê Te', name_ph: 'Navê xwe binivîse',
    phone: 'Hejmara Telefona Te', phone_ph: '09xxxxxxxx',
    send: '2. Hûrguliyan bişînin WhatsApp a Sulaiman Rbooshi',
    result_title: 'Materyalên Texmînkirî ji bo', cable: 'Kablo', breaker: 'Sîgorte', socket: 'Priz', switch: 'Şalter', panel: 'Tablo', piece: 'danê', meter: 'm', panel_unit: 'tablo',
    alert: 'Ji kerema xwe rûber û hejmara jûran binivîse', alert2: 'Ji kerema xwe nav û telefon binivîse',
    whatsapp_msg: '🔌 Daxwaza Texmînê ya Nû ji Hesabkera RBooSH%0A%0ANav: %NAME%%0ATelefon: %PHONE%%0ACureyê Cihê: %PLACE%%0ARûber: %AREA% m2%0AHejmara Jûran: %ROOMS%%0A%0A*Materyalên Pêwîst:*%0A- Kablo 2.5mm: %C25% m%0A- Kablo 4mm: %C4% m%0A- Kablo 6mm: %C6% m%0A- Sîgorte: %BR% danê%0A- Priz: %SO% danê%0A- Şalter: %SW% danê%0A- Tablo: %PA% tablo'
  }
};

function setLang(lang){
  currentLang = lang;
  const t = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = t.dir;

  document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');

  document.getElementById('back_link').innerText = t.back;
  document.getElementById('title').innerText = t.title;
  document.getElementById('subtitle').innerText = t.subtitle;
  document.getElementById('label_place').innerText = t.place;
  document.getElementById('opt_house').innerText = t.house;
  document.getElementById('opt_shop').innerText = t.shop;
  document.getElementById('opt_factory').innerText = t.factory;
  document.getElementById('label_area').innerText = t.area;
  document.getElementById('area').placeholder = t.area_ph;
  document.getElementById('label_rooms').innerText = t.rooms;
  document.getElementById('rooms').placeholder = t.rooms_ph;
  document.getElementById('btn_calc').innerText = t.calc;
  document.getElementById('label_name').innerText = t.name;
  document.getElementById('c_name').placeholder = t.name_ph;
  document.getElementById('label_phone').innerText = t.phone;
  document.getElementById('c_phone').placeholder = t.phone_ph;
  document.getElementById('btn_send').innerText = t.send;
}

function calcOnly(){
  const t = translations[currentLang];
  let place = document.getElementById('place_type').value;
  let area = document.getElementById('area').value;
  let rooms = document.getElementById('rooms').value;
  if(!area ||!rooms){ alert(t.alert); return; }

  let factor = place=="factory"?2.2: place=="shop"?1.6:1.3;
  let placeName = document.getElementById('place_type').options[document.getElementById('place_type').selectedIndex].text;

  lastCalc = {
    cable2_5: Math.round(area * factor),
    cable4: Math.round(rooms * 30),
    cable6: Math.round(rooms * 15),
    breaker: Math.ceil(rooms / 2) + 3,
    sockets: rooms * (place == "factory"? 6 : 4),
    switches: rooms * 2,
    panels: place == "factory"? 2 : 1,
    placeName, area, rooms
  };

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = `
    <h4>${t.result_title} ${lastCalc.placeName}:</h4>
    <p>- ${t.cable} 2.5mm: <b>${lastCalc.cable2_5} ${t.meter}</b></p>
    <p>- ${t.cable} 4mm: <b>${lastCalc.cable4} ${t.meter}</b></p>
    <p>- ${t.cable} 6mm: <b>${lastCalc.cable6} ${t.meter}</b></p>
    <p>- ${t.breaker}: <b>${lastCalc.breaker} ${t.piece}</b></p>
    <p>- ${t.socket}: <b>${lastCalc.sockets} ${t.piece}</b></p>
    <p>- ${t.switch}: <b>${lastCalc.switches} ${t.piece}</b></p>
    <p>- ${t.panel}: <b>${lastCalc.panels} ${t.panel_unit}</b></p>
  `;
  document.getElementById('contactBox').style.display = 'block';
}

function sendToWhatsApp(){
  const t = translations[currentLang];
  let name = document.getElementById('c_name').value;
  let phone = document.getElementById('c_phone').value;
  if(!name ||!phone){ alert(t.alert2); return; }

  let message = t.whatsapp_msg
  .replace('%NAME%', name).replace('%PHONE%', phone).replace('%PLACE%', lastCalc.placeName)
  .replace('%AREA%', lastCalc.area).replace('%ROOMS%', lastCalc.rooms)
  .replace('%C25%', lastCalc.cable2_5).replace('%C4%', lastCalc.cable4).replace('%C6%', lastCalc.cable6)
  .replace('%BR%', lastCalc.breaker).replace('%SO%', lastCalc.sockets).replace('%SW%', lastCalc.switches).replace('%PA%', lastCalc.panels);

  let whatsappNumber = "4915216839609"; // سليمان ربوشي
  window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
}
</script>
</body>
</html>
