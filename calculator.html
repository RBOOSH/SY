<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة تقدير المواد | RBooSH™</title>
<style>
  *{margin:0; padding:0; box-sizing:border-box; font-family:'Tahoma', sans-serif;}
  body{background:#000; color:#fff; line-height:1.8;}
  header{background:#000; border-bottom:2px solid #1e3a8a; padding:15px 20px; text-align:center;}
  header .logo{font-size:24px; font-weight:bold; color:#1e3a8a;}
  header a{color:#aaa; text-decoration:none; font-size:14px;}
  .container{max-width:600px; margin:40px auto; padding:20px;}
  .calculator {background:#111; padding:30px; border-radius:12px; border:1px solid #1e3a8a;}
  h2{color:#1e3a8a; margin-bottom:10px; text-align:center;}
  .calc-form {display:flex; flex-direction:column; gap:15px; margin-top:20px;}
  .calc-form label{font-size:14px; color:#aaa;}
  .calc-form input, .calc-form select {padding:14px; border-radius:8px; border:1px solid #333; background:#000; color:#fff; font-size:16px;}
  .calc-form button {background:#1e3a8a; color:#fff; padding:16px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; font-size:16px;}
  .calc-form button.whatsapp {background:#25D366;}
  .calc-form button:hover {opacity:0.9;}
  .calc-result {background:#0a0a0a; border:1px solid #1e3a8a; padding:20px; border-radius:10px; margin-top:20px; text-align:right;}
  footer{text-align:center; padding:20px; color:#555; font-size:12px;}
</style>
</head>
<body>

<header>
  <div class="logo">RBooSH™</div>
  <a href="index.html">← الرجوع للموقع الرئيسي</a>
</header>

<div class="container">
  <div class="calculator">
    <h2>حاسبة تقدير المواد الكهربائية</h2>
    <p style="text-align:center; color:#aaa; font-size:14px;">احسب كمياتك التقريبية وارسلها مباشرة لواتساب سليمان ربوشي</p>
    
    <div class="calc-form">
      <label>نوع المكان</label>
      <select id="place_type">
        <option value="house">بيت سكني</option>
        <option value="shop">محل تجاري</option>
        <option value="factory">معمل / ورشة</option>
      </select>

      <label>المساحة بالمتر المربع</label>
      <input type="number" id="area" placeholder="مثال: 150">

      <label>عدد الغرف / الاقسام</label>
      <input type="number" id="rooms" placeholder="مثال: 3">

      <button onclick="calcOnly()">1. احسب الكميات</button>

      <div id="result" class="calc-result" style="display:none;"></div>

      <div id="contactBox" style="display:none;">
        <label>اسمك</label>
        <input type="text" id="c_name" placeholder="احمد محمد">
        <label>رقم هاتفك</label>
        <input type="tel" id="c_phone" placeholder="09xxxxxxxx">
        <button onclick="sendToWhatsApp()" class="whatsapp">2. ارسال التفاصيل لواتساب سليمان ربوشي</button>
      </div>
    </div>
  </div>
</div>

<footer>
  © 2026 RBooSH™ | القامشلي - المنطقة الصناعية
</footer>

<script>
let lastCalc = {};
function calcOnly(){
  let place = document.getElementById('place_type').value;
  let area = document.getElementById('area').value;
  let rooms = document.getElementById('rooms').value;
  if(!area || !rooms){ alert("الرجاء ادخال المساحة وعدد الغرف"); return; }

  let factor = place=="factory"?2.2: place=="shop"?1.6:1.3;
  let placeName = place=="factory"?"معمل / ورشة": place=="shop"?"محل تجاري":"بيت سكني";

  lastCalc = {
    cable2_5: Math.round(area * factor),
    cable4: Math.round(rooms * 30),
    cable6: Math.round(rooms * 15),
    breaker: Math.ceil(rooms / 2) + 3,
    sockets: rooms * (place == "factory" ? 6 : 4),
    switches: rooms * 2,
    panels: place == "factory" ? 2 : 1,
    placeName, area, rooms
  };

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = `
    <h4>التقدير التقريبي لـ ${lastCalc.placeName}:</h4>
    <p>- كابل 2.5mm: <b>${lastCalc.cable2_5} متر</b></p>
    <p>- كابل 4mm: <b>${lastCalc.cable4} متر</b></p>
    <p>- كابل 6mm: <b>${lastCalc.cable6} متر</b></p>
    <p>- قواطع: <b>${lastCalc.breaker} حبة</b></p>
    <p>- برايز: <b>${lastCalc.sockets} حبة</b></p>
    <p>- مفاتيح: <b>${lastCalc.switches} حبة</b></p>
    <p>- لوحات: <b>${lastCalc.panels} لوحة</b></p>
  `;
  document.getElementById('contactBox').style.display = 'flex';
}

function sendToWhatsApp(){
  let name = document.getElementById('c_name').value;
  let phone = document.getElementById('c_phone').value;
  if(!name || !phone){ alert("الرجاء ادخال الاسم والرقم"); return; }
  
  let message = `🔌 طلب تقدير جديد من حاسبة RBooSH%0A%0Aالاسم: ${name}%0Aالتلفون: ${phone}%0Aنوع المكان: ${lastCalc.placeName}%0Aالمساحة: ${lastCalc.area} متر%0Aعدد الغرف: ${lastCalc.rooms}%0A%0A*الكميات المطلوبة:*%0A- 2.5mm: ${lastCalc.cable2_5} متر%0A- 4mm: ${lastCalc.cable4} متر%0A- 6mm: ${lastCalc.cable6} متر%0A- قواطع: ${lastCalc.breaker} حبة%0A- برايز: ${lastCalc.sockets} حبة%0A- مفاتيح: ${lastCalc.switches} حبة%0A- لوحات: ${lastCalc.panels} لوحة`;
  
  let whatsappNumber = "4915216839609"; // سليمان ربوشي
  
  window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
}
</script>
</body>
</html>
