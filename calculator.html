<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}

.day-name{font-size:12px;font-weight:900;color:var(--blue)}

.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px}

.hand-large{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:4px;z-index:5}
.hour-hand-large{width:6px;height:45px;background:#111;margin-left:-3px}

.sidebar-day{font-size:18px;font-weight:900;color:var(--blue)}
.sidebar-date-num{font-size:15px;color:var(--text2);font-weight:bold}
.sidebar-divider{height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);margin:15px 0;border:none}
.sidebar-title{color:var(--blue);text-align:center;margin:10px 0 15px 0;font-size:18px}
.sidebar a{display:block;padding:14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;z-index:1000}.overlay.show{display:block}

.logo{text-align:center;margin:10px 0 20px 0}.logo img{max-width:280px;width:100%;filter:drop-shadow(0 0 20px rgba(0,191,255,0.6))}

function toggleTheme(){document.body.classList.toggle('light');let isLight=document.body.classList.contains('light');localStorage.setItem('rboosh_theme', isLight?'light':'dark');document.getElementById('themeBtn').innerText=isLight?'🌙':'☀️';}

function updateClock(){let now=new Date();let h=now.getHours()%12;let m=now.getMinutes();let s=now.getSeconds();document.getElementById('hourHand').style.transform=`translateX(-50%) rotate(${(h+m/60)*30}deg)`;document.getElementById('minuteHand').style.transform=`translateX(-50%) rotate(${m*6}deg)`;document.getElementById('secondHand').style.transform=`translateX(-50%) rotate(${s*6}deg)`;document.getElementById('hourHandLarge').style.transform=`translateX(-50%) rotate(${(h+m/60)*30}deg)`;document.getElementById('minuteHandLarge').style.transform=`translateX(-50%) rotate(${m*6}deg)`;document.getElementById('secondHandLarge').style.transform=`translateX(-50%) rotate(${s*6}deg)`;let t=translations[currentLang];document.getElementById('dayName').innerText=t.days[now.getDay()];document.getElementById('dateNum').innerText=now.getDate()+" "+t.months[now.getMonth()];document.getElementById('sidebarDay').innerText=t.days[now.getDay()];document.getElementById('sidebarDate').innerText=now.getDate()+" "+t.months[now.getMonth()]+" "+now.getFullYear();}

function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function calcOnly(){const t=translations[currentLang];let place=document.getElementById('place_type').value;let area=document.getElementById('area').value;let rooms=document.getElementById('rooms').value;if(!area||!rooms){alert(t.alert);return;}let factor=place=="factory"?2.2:place=="shop"?1.6:1.3;let placeName=document.getElementById('place_type').options[document.getElementById('place_type').selectedIndex].text;lastCalc={cable2_5:Math.round(area*factor),cable4:Math.round(rooms*30),cable6:Math.round(rooms*15),breaker:Math.ceil(rooms/2)+3,sockets:rooms*(place=="factory"?6:4),switches:rooms*2,panels:place=="factory"?2:1,placeName,area,rooms};document.getElementById('result').style.display='block';document.getElementById('result').innerHTML=`<h4>${t.result_title} ${lastCalc.placeName}:</h4><p>- ${t.cable} 2.5mm: <b>${lastCalc.cable2_5} ${t.meter}</b></p><p>- ${t.cable} 4mm: <b>${lastCalc.cable4} ${t.meter}</b></p><p>- ${t.cable} 6mm: <b>${lastCalc.cable6} ${t.meter}</b></p><p>- ${t.breaker}: <b>${lastCalc.breaker} ${t.piece}</b></p><p>- ${t.socket}: <b>${lastCalc.sockets} ${t.piece}</b></p><p>- ${t.switch}: <b>${lastCalc.switches} ${t.piece}</b></p><p>- ${t.panel}: <b>${lastCalc.panels} ${t.panel_unit}</b></p>`;document.getElementById('contactBox').style.display='block';}
function sendToWhatsApp(){const t=translations[currentLang];let name=document.getElementById('c_name').value;let phone=document.getElementById('c_phone').value;if(!name||!phone){alert(t.alert2);return;}let message=t.whatsapp_msg.replace('%NAME%',name).replace('%PHONE%',phone).replace('%PLACE%',lastCalc.placeName).replace('%AREA%',lastCalc.area).replace('%ROOMS%',lastCalc.rooms).replace('%C25%',lastCalc.cable2_5).replace('%C4%',lastCalc.cable4).replace('%C6%',lastCalc.cable6).replace('%BR%',lastCalc.breaker).replace('%SO%',lastCalc.sockets).replace('%SW%',lastCalc.switches).replace('%PA%',lastCalc.panels);window.open(`https://wa.me/4915216839609?text=${message}`,'_blank');}
function updateCounter(){let viewers=Math.floor(Math.random()*80)+120;let orders=Math.floor(Math.random()*15)+22;let g1=data[currentLang].gov[Math.floor(Math.random()*data[currentLang].gov.length)];let g2=data[currentLang].gov[Math.floor(Math.random()*data[currentLang].gov.length)];if(currentLang==='ar') document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.ar.viewing} - ${orders} ${data.ar.orders} ${g1}، ${g2} و باقي المحافظات`;else if(currentLang==='en') document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.en.viewing} - ${orders} ${data.en.orders} ${g1}, ${g2} & others`;else document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.ku.viewing} - ${orders} ${data.ku.orders} ${g1}, ${g2} û yên din`;}
setInterval(updateClock,1000);updateClock();
setInterval(updateCounter,4000);
function showPopup(){let d=data[currentLang];let n=d.names[Math.floor(Math.random()*d.names.length)];let g=d.gov[Math.floor(Math.random()*d.gov.length)];let mins=Math.floor(Math.random()*8)+1;let img=productsImg[Math.floor(Math.random()*productsImg.length)];document.getElementById('popupImg').src=img;if(currentLang==='ar'){document.getElementById('popupTitle').innerHTML=`✅ ${n} من ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`حسب ${Math.floor(Math.random()*200)+50} متر كابل - ${d.ago} ${mins} ${d.min} ✅`;}else if(currentLang==='en'){document.getElementById('popupTitle').innerHTML=`✅ ${n} from ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`Calculated ${Math.floor(Math.random()*200)+50}m cable - ${mins} ${d.min} ${d.ago} ✅`;}else{document.getElementById('popupTitle').innerHTML=`✅ ${n} ji ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`${Math.floor(Math.random()*200)+50}m kablo ${d.calc} - ${d.ago} ${mins} ${d.min} ✅`; }document.getElementById('orderPopup').classList.add('show');setTimeout(()=>{document.getElementById('orderPopup').classList.remove('show');},4500);}
setTimeout(showPopup,3000);setInterval(showPopup,8500);updateCounter();
</script>
