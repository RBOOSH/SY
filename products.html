<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منتجاتنا - RBooSH™</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#000;color:#fff;line-height:1.8}
.container{max-width:1100px;margin:0 auto;padding:20px;padding-top:80px}
.logo{text-align:center;margin:20px 0}
.logo img{max-width:250px;width:100%}
h1{color:#00bfff;text-align:center;margin:20px 0}
.header-top{position:fixed;top:0;left:0;right:0;background:#000;border-bottom:2px solid #1e3a8a;padding:12px 15px;z-index:1000;display:flex;justify-content:space-between;align-items:center}
.menu-btn{font-size:28px;background:none;border:none;color:#00bfff;cursor:pointer}
.lang-switch{display:flex;gap:6px}
.lang-btn{background:#222;color:#aaa;border:1px solid #333;padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px}
.lang-btn.active{background:#00bfff;color:#000}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#111;border-left:2px solid #1e3a8a;z-index:1001;transition:0.3s;padding:20px}
.sidebar.open{right:0}
[dir="ltr"].sidebar{right:auto;left:-300px;border-right:2px solid #1e3a8a}
[dir="ltr"].sidebar.open{left:0}
.sidebar a{display:block;padding:14px;color:#fff;text-decoration:none;border-bottom:1px solid #222}
.close-btn{background:none;border:none;color:#fff;font-size:24px;float:left;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;z-index:1000}
.overlay.show{display:block}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:30px}
.product-card{background:#111;border:1px solid #222;border-radius:15px;overflow:hidden;transition:0.3s}
.product-card:hover{border-color:#00bfff;transform:translateY(-5px)}
.product-card img{width:100%;height:280px;object-fit:contain;background:#000;padding:15px}
.product-body{padding:18px}
.product-badge{background:#1e3a8a;color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:10px}
.product-body h3{font-size:16px;margin-bottom:8px;color:#fff;min-height:45px}
.product-desc{font-size:13px;color:#aaa;margin-bottom:10px;min-height:40px}
.product-price{color:#00bfff;font-weight:bold;font-size:16px;margin:10px 0}
.btn-wa{background:#25D366;color:#fff;text-align:center;padding:12px;border-radius:10px;display:block;text-decoration:none;font-weight:bold;margin-top:10px}
.btn-home{background:#1e3a8a;color:#fff;padding:12px 25px;border-radius:10px;text-decoration:none;display:inline-block;margin:20px auto;text-align:center}
footer{text-align:center;padding:30px;color:#555;font-size:12px}
</style>
</head>
<body>
<div class="header-top">
<button class="menu-btn" onclick="openMenu()">☰</button>
<div class="lang-switch">
<button class="lang-btn active" onclick="setLang('ar')">AR</button>
<button class="lang-btn" onclick="setLang('en')">EN</button>
<button class="lang-btn" onclick="setLang('ku')">KU</button>
</div>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
<button class="close-btn" onclick="closeMenu()">×</button>
<h3 id="menu_title" style="color:#00bfff;text-align:center;margin-bottom:20px;">القائمة</h3>
<a href="index.html" id="menu_home">الرئيسية</a>
<a href="products.html" id="menu_products">المنتجات</a>
<a href="calculator.html" id="menu_calc">الحاسبة</a>
</div>
<div class="container">
<div class="logo"><img src="logo.png" alt="RBooSH"></div>
<h1 id="page_title">منتجاتنا ⚡</h1>
<p style="text-align:center;color:#aaa;" id="page_desc">جميع المنتجات مكفولة من RBooSH™</p>
<div class="products-grid" id="productsGrid"></div>
<div style="text-align:center;"><a href="index.html" class="btn-home" id="back_btn">⬅️ رجوع للرئيسية</a></div>
<footer>© 2026 RBooSH™ - Abu Suleiman Group</footer>
</div>
<script>
let currentLang='ar';
const products=[
{
name_ar:"حماية فاز ديجيتال Pollux - 3 فاز",
name_en:"Pollux Digital Phase Protector - 3 Phase",
name_ku:"Parastina Faz Pollux - 3 Faz",
desc_ar:"حماية من ارتفاع وانخفاض الجهد، شاشة ديجيتال للفولت والأمبير.",
desc_en:"Over/under voltage protection, digital display for V & A.",
desc_ku:"Parastina ji bilind û nizm bûna voltajê, dîmendera dîjîtal.",
price_ar:"سعر خاص - اتصل",
price_en:"Special Price - Contact",
price_ku:"Bihayê Taybet - Têkilî",
badge_ar:"حماية ⚡",
badge_en:"Protection ⚡",
badge_ku:"Parastin ⚡",
image:"https://i.postimg.cc/0zY46NQ8/IMG-20260902-WA0091.jpg"
},
{
name_ar:"فلتر الموجة الجيبية - Sine Wave Filter",
name_en:"Sine Wave Filter - Industrial",
name_ku:"Fîltera Pêla Sînus - Pîşesazî",
desc_ar:"يحمي المحركات والمضخات، يحول الموجة لموجة جيبية نقية.",
desc_en:"Protects motors & pumps, converts to pure sine wave.",
desc_ku:"Motoran diparêze, pêlê dike sînus pak.",
price_ar:"سعر خاص - اتصل",
price_en:"Special Price - Contact",
price_ku:"Bihayê Taybet - Têkilî",
badge_ar:"جديد ⚡",
badge_en:"New ⚡",
badge_ku:"Nû ⚡",
image:"https://i.postimg.cc/m2LXNbJh/IMG-20260917-WA0018.jpg"
},
{
name_ar:"قاطع DC التاج Altech 2*63A - 10KA",
name_en:"Altech Crown DC Breaker 2*63A 10KA",
name_ku:"Şalter DC Tac Altech 2*63A 10KA",
desc_ar:"قاطع DC أصلي هندي، 10KA للطاقة الشمسية.",
desc_en:"Original Indian DC breaker, 10KA for solar.",
desc_ku:"Şalter DC Hindî orjînal, 10KA bo rojê.",
price_ar:"سعر خاص - اتصل",
price_en:"Special Price - Contact",
price_ku:"Bihayê Taybet - Têkilî",
badge_ar:"الأصلي 🔥",
badge_en:"Original 🔥",
badge_ku:"Orjînal 🔥",
image:"https://i.postimg.cc/KksCDstS/Picsart-26-09-23-23-51-15-827.jpg"
}
];
function render(){
const grid=document.getElementById('productsGrid');
grid.innerHTML="";
products.forEach(p=>{
let name=currentLang==='en'?p.name_en:currentLang==='ku'?p.name_ku:p.name_ar;
let desc=currentLang==='en'?p.desc_en:currentLang==='ku'?p.desc_ku:p.desc_ar;
let price=currentLang==='en'?p.price_en:currentLang==='ku'?p.price_ku:p.price_ar;
let badge=currentLang==='en'?p.badge_en:currentLang==='ku'?p.badge_ku:p.badge_ar;
let btn=currentLang==='en'?'Order on WhatsApp 📱':currentLang==='ku'?'Li WhatsApp Bixwaze 📱':'اطلب عبر واتساب 📱';
let msg=currentLang==='en'?'Hello Sulaiman, I want ':'مرحبا سليمان اريد ';
grid.innerHTML+=`<div class="product-card"><img src="${p.image}" alt="${name}"><div class="product-body"><span class="product-badge">${badge}</span><h3>${name}</h3><p class="product-desc">${desc}</p><div class="product-price">${price}</div><a class="btn-wa" href="https://wa.me/4915216839609?text=${msg}${encodeURIComponent(name)}" target="_blank">${btn}</a></div></div>`;
});
}
const tr={
ar:{dir:'rtl',menu_title:'القائمة',menu_home:'الرئيسية',menu_products:'المنتجات',menu_calc:'الحاسبة',page_title:'منتجاتنا ⚡',page_desc:'جميع المنتجات مكفولة من RBooSH™',back_btn:'⬅️ رجوع للرئيسية'},
en:{dir:'ltr',menu_title:'Menu',menu_home:'Home',menu_products:'Products',menu_calc:'Calculator',page_title:'Our Products ⚡',page_desc:'All products warranted by RBooSH™',back_btn:'⬅️ Back to Home'},
ku:{dir:'ltr',menu_title:'Menu',menu_home:'Mal',menu_products:'Berhem',menu_calc:'Hesabker',page_title:'Berhemên Me ⚡',page_desc:'Hemû berhem bi garantiya RBooSH™',back_btn:'⬅️ Vegere Malê'}
};
function setLang(lang){
currentLang=lang;
let t=tr[lang];
document.documentElement.lang=lang;
document.documentElement.dir=t.dir;
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
for(let k in t){if(document.getElementById(k))document.getElementById(k).innerHTML=t[k];}
render();
}
function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
render();
</script>
</body>
</html>
