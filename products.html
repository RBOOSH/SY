<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منتجاتنا - RBooSH™</title>
<style>
:root{--bg:#000;--card:#111;--card2:#0a0a0a;--text:#fff;--text2:#aaa;--border:#222;--blue:#00bfff;--blue2:#1e3a8a}
body.light{--bg:#f5f7fb;--card:#fff;--card2:#eef2ff;--text:#111;--text2:#555;--border:#dbe3ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.8;transition:0.4s}
.container{max-width:1100px;margin:0 auto;padding:20px;padding-top:80px}
.logo{text-align:center;margin:20px 0}.logo img{max-width:250px;width:100%;filter:drop-shadow(0 0 20px rgba(0,191,255,0.5))}
h1{color:var(--blue);text-align:center;margin:20px 0;text-shadow:0 0 15px rgba(0,191,255,0.6)}
.header-top{position:fixed;top:0;left:0;right:0;background:var(--bg);border-bottom:2px solid var(--blue2);padding:12px 15px;z-index:1000;display:flex;justify-content:space-between;align-items:center;transition:0.4s}
.menu-btn{font-size:28px;background:none;border:none;color:var(--blue);cursor:pointer}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px;transition:0.3s}
.theme-btn:hover{border-color:var(--blue);box-shadow:0 0 15px rgba(0,191,255,0.4);transform:scale(1.05)}
.lang-switch{display:flex;gap:6px}.lang-btn{background:var(--card);color:var(--text2);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px;transition:0.3s}.lang-btn.active{background:var(--blue);color:#000;box-shadow:0 0 15px rgba(0,191,255,0.6)}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100%;background:var(--card);border-left:2px solid var(--blue2);z-index:1001;transition:0.3s;padding:20px}.sidebar.open{right:0}
[dir="ltr"].sidebar{right:auto;left:-300px;border-left:none;border-right:2px solid var(--blue2)}[dir="ltr"].sidebar.open{left:0}
.sidebar a{display:block;padding:14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.close-btn{background:none;border:none;color:var(--text);font-size:24px;float:left;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;z-index:1000}.overlay.show{display:block}
.filter-bar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--text2);padding:10px 18px;border-radius:25px;cursor:pointer;font-weight:bold;transition:0.3s;font-size:13px}
.filter-btn.active,.filter-btn:hover{background:var(--blue);color:#000;border-color:var(--blue);box-shadow:0 0 20px rgba(0,191,255,0.8)}
.install-banner{background:linear-gradient(135deg,var(--blue2),var(--blue));border-radius:15px;padding:20px;margin:25px 0;text-align:center;border:2px solid var(--blue);animation:glow 2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px var(--blue2),0 0 20px rgba(0,191,255,0.2)}to{box-shadow:0 0 25px var(--blue),0 0 40px rgba(0,191,255,0.6)}}
.visitor-counter{background:var(--card);border:1px dashed var(--blue);border-radius:12px;padding:12px 18px;margin:0 auto 20px auto;text-align:center;max-width:550px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 0 15px rgba(0,191,255,0.2)}
.live-dot{width:10px;height:10px;background:#ff0000;border-radius:50%;animation:livePulse 1s infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 8px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}
.visitor-counter span{font-size:14px;color:#00ff88;font-weight:bold}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:20px}
.product-card{background:var(--card);border:1px solid var(--border);border-radius:15px;overflow:hidden;transition:0.4s;position:relative}
.product-card:hover{border-color:var(--blue);transform:translateY(-6px);box-shadow:0 0 20px rgba(0,191,255,0.5),0 10px 30px rgba(0,0,0,0.2)}
.product-card img{width:100%;height:280px;object-fit:contain;background:var(--bg);padding:15px;transition:0.4s}
.product-card:hover img{transform:scale(1.03)}
.product-body{padding:18px}.product-badge{background:var(--blue2);color:#fff;font-size:11px;padding:4px 10px;border-radius:20px;display:inline-block;margin-bottom:10px;box-shadow:0 0 10px rgba(30,58,138,0.5)}
.product-body h3{font-size:15px;margin-bottom:8px;color:var(--text);min-height:45px}.product-desc{font-size:13px;color:var(--text2);margin-bottom:10px;min-height:35px}
.product-price{color:var(--blue);font-weight:900;font-size:17px;margin:12px 0;letter-spacing:1px;text-shadow:0 0 10px rgba(0,191,255,0.6)}
.product-price sup{font-size:9px;vertical-align:super;margin-left:2px;color:var(--text2)}
.product-price.check{color:#25D366;text-shadow:0 0 8px #25D366;font-size:16px;margin-right:4px}
.live-view{position:absolute;top:12px;left:12px;background:rgba(0,0,0,0.8);border:1px solid #00ff88;color:#00ff88;font-size:11px;padding:4px 8px;border-radius:20px;display:flex;align-items:center;gap:5px}
.live-view i{width:6px;height:6px;background:#00ff88;border-radius:50%;display:inline-block;animation:livePulse 1s infinite}
.btn-wa{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;text-align:center;padding:14px;border-radius:12px;display:block;text-decoration:none;font-weight:bold;margin-top:10px;font-size:15px;box-shadow:0 0 15px rgba(37,211,102,0.6),0 4px 15px rgba(0,0,0,0.3);border:1px solid #25D366;animation:whatsappGlow 2s infinite alternate;position:relative;overflow:hidden}
.btn-wa::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.4),transparent);animation:shine 2.5s infinite}
@keyframes whatsappGlow{from{box-shadow:0 0 10px rgba(37,211,102,0.5)}to{box-shadow:0 0 25px rgba(37,211,102,0.9),0 0 40px rgba(37,211,102,0.4)}}
@keyframes shine{0%{left:-100%}100%{left:100%}}
footer{text-align:center;padding:30px;color:#777;font-size:12px}
.order-popup{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid #25D366;border-radius:15px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:2000;transform:translateX(400px);transition:0.5s;max-width:320px;box-shadow:0 0 20px rgba(37,211,102,0.4)}
.order-popup.show{transform:translateX(0)}
.order-popup img{width:50px;height:50px;border-radius:10px;object-fit:cover;background:var(--bg)}
[dir="ltr"].order-popup{right:auto;left:20px;transform:translateX(-400px)}[dir="ltr"].order-popup.show{transform:translateX(0)}
</style>
</head>
<body>
<div class="header-top"><button class="menu-btn" onclick="openMenu()">☰</button><div class="header-actions"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button><div class="lang-switch"><button class="lang-btn active" onclick="setLang('ar')">AR</button><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('ku')">KU</button></div></div></div>

const tr={

function setLang(lang){
currentLang=lang;let t=tr[lang];
document.documentElement.lang=lang;document.documentElement.dir=t.dir;
document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));
document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
document.getElementById('menu_title').innerText=t.menu_title;document.getElementById('menu_home').innerText=t.menu_home;document.getElementById('menu_products').innerText=t.menu_products;document.getElementById('menu_calc').innerText=t.menu_calc;

render();updateCounter();
}
function filterProducts(cat){currentFilter=cat;render();}
function render(){
let t=tr[currentLang];
let fb=document.getElementById('filterBar');
fb.innerHTML=`<button class="filter-btn ${currentFilter=='all'?'active':''}" onclick="filterProducts('all')">${t.f_all}</button><button class="filter-btn ${currentFilter=='smart'?'active':''}" onclick="filterProducts('smart')">${t.f_smart}</button><button class="filter-btn ${currentFilter=='solar'?'active':''}" onclick="filterProducts('solar')">${t.f_solar}</button><button class="filter-btn ${currentFilter=='industrial'?'active':''}" onclick="filterProducts('industrial')">${t.f_ind}</button><button class="filter-btn ${currentFilter=='protection'?'active':''}" onclick="filterProducts('protection')">${t.f_pro}</button>`;

function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}

let p=products[Math.floor(Math.random()*products.length)];let d=fakeData[currentLang];let n=d.names[Math.floor(Math.random()*d.names.length)];let g=d.gov[Math.floor(Math.random()*d.gov.length)];let mins=Math.floor(Math.random()*8)+1;

}
setTimeout(showPopup,3000);setInterval(showPopup,8500);render();updateCounter();setInterval(updateCounter,4000);
