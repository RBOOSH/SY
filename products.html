<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:#000;color:#fff;line-height:1.8}

[dir="ltr"].sidebar{right:auto;left:-300px;border-right:2px solid #1e3a8a}[dir="ltr"].sidebar.open{left:0}
.sidebar a{display:block;padding:14px;color:#fff;text-decoration:none;border-bottom:1px solid #222}
.close-btn{background:none;border:none;color:#fff;font-size:24px;float:left;cursor:pointer}
