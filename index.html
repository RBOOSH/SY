<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBooSH™ | الرئيسية</title>
<style>
:root{--bg:#000;--card:#111;--card2:#0a0a0a;--text:#fff;--text2:#aaa;--border:#222;--blue:#00bfff;--blue2:#1e3a8a}
body.light{--bg:#f5f7fb;--card:#fff;--card2:#eef2ff;--text:#111;--text2:#555;--border:#dbe3ff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tahoma',sans-serif}
body{background:var(--bg);color:var(--text);line-height:1.8;transition:0.4s}
.header-top{position:fixed;top:0;left:0;right:0;background:var(--bg);border-bottom:2px solid var(--blue2);padding:10px 12px;z-index:1000;display:flex;justify-content:space-between;align-items:center;gap:10px}
.header-left{display:flex;align-items:center;gap:12px}
.menu-btn{font-size:28px;background:none;border:none;color:var(--blue);cursor:pointer}
.clock-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:28px;padding:5px 12px 5px 7px}
.analog-clock{width:52px;height:52px;border:2.5px solid var(--blue);border-radius:50%;position:relative;background:#fff;box-shadow:0 0 12px rgba(0,191,255,0.7);flex-shrink:0;overflow:hidden}
.clock-logo{position:absolute;left:50%;top:72%;width:48px;height:18px;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;z-index:2}
.clock-center{position:absolute;top:50%;left:50%;width:8px;height:8px;background:#00bfff;border-radius:50%;transform:translate(-50%,-50%);z-index:10;border:1.5px solid #fff}
.hand{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:3px;z-index:5}
.hour-hand{width:3px;height:13px;background:#111;margin-left:-1.5px}
.minute-hand{width:2.2px;height:17px;background:#111;margin-left:-1.1px}
.second-hand{width:1.2px;height:19px;background:#ff0000;margin-left:-0.6px}
.date-info{display:flex;flex-direction:column;line-height:1.2;text-align:center}
.day-name{font-size:12px;font-weight:900;color:var(--blue)}
.date-num{font-size:11px;color:var(--text2);font-weight:bold}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-btn{background:var(--card);border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:18px}
.lang-switch{display:flex;gap:6px}.lang-btn{background:var(--card);color:var(--text2);border:1px solid var(--border);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:12px}.lang-btn.active{background:var(--blue);color:#000}
.sidebar{position:fixed;top:0;right:-300px;width:285px;height:100%;background:var(--card);border-left:2px solid var(--blue2);z-index:1001;transition:0.3s;padding:20px;overflow-y:auto}.sidebar.open{right:0}[dir="ltr"].sidebar{right:auto;left:-300px;border-right:2px solid var(--blue2)}[dir="ltr"].sidebar.open{left:0}
.sidebar-clock-section{text-align:center;padding:15px 0 10px 0}
.analog-clock-large{width:180px;height:180px;border:4px solid var(--blue);border-radius:50%;position:relative;background:#fff;box-shadow:0 0 25px rgba(0,191,255,0.9);margin:0 auto;overflow:hidden}
.clock-logo-large{position:absolute;left:50%;top:73%;width:175px;height:58px;transform:translate(-50%,-50%);object-fit:contain;pointer-events:none;z-index:2}
.clock-center-large{position:absolute;top:50%;left:50%;width:14px;height:14px;background:var(--blue);border-radius:50%;transform:translate(-50%,-50%);z-index:10;border:2px solid #fff}
.hand-large{position:absolute;bottom:50%;left:50%;transform-origin:50% 100%;border-radius:4px;z-index:5}
.hour-hand-large{width:6px;height:45px;background:#111;margin-left:-3px}
.minute-hand-large{width:5px;height:65px;background:#111;margin-left:-2.5px}
.second-hand-large{width:2px;height:75px;background:#ff0000;margin-left:-1px}
.sidebar-date{margin-top:15px;display:flex;flex-direction:column;gap:4px}
.sidebar-day{font-size:18px;font-weight:900;color:var(--blue)}
.sidebar-date-num{font-size:15px;color:var(--text2);font-weight:bold}
.sidebar-divider{height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);margin:15px 0;border:none}
.sidebar-title{color:var(--blue);text-align:center;margin:10px 0 15px 0;font-size:18px}
.sidebar a{display:block;padding:14px;color:var(--text);text-decoration:none;border-bottom:1px solid var(--border)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;z-index:1000}.overlay.show{display:block}
.container{max-width:900px;margin:30px auto;padding:20px;padding-top:85px}
.logo{text-align:center;margin:10px 0 20px 0}.logo img{max-width:280px;width:100%;filter:drop-shadow(0 0 20px rgba(0,191,255,0.6))}
.visitor-counter{background:var(--card);border:1px dashed var(--blue);border-radius:12px;padding:12px 18px;margin:0 auto 20px auto;text-align:center;max-width:550px;display:flex;align-items:center;justify-content:center;gap:10px}
.live-dot{width:10px;height:10px;background:#ff0000;border-radius:50%;animation:livePulse 1s infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7)}70%{box-shadow:0 0 0 8px rgba(255,0,0,0)}100%{box-shadow:0 0 0 0 rgba(255,0,0,0)}}
.visitor-counter span{font-size:14px;color:#00ff88;font-weight:bold}
.hero{background:var(--card);border:2px solid var(--blue2);border-radius:16px;padding:30px;text-align:center;box-shadow:0 0 25px rgba(0,191,255,0.15)}
.hero h1{color:var(--blue);font-size:26px;margin-bottom:10px}
.hero p{color:var(--text2);font-size:14px}
.order-popup{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid #25D366;border-radius:15px;padding:12px 16px;display:flex;align-items:center;gap:12px;z-index:2000;transform:translateX(400px);transition:0.5s;max-width:320px}
.order-popup.show{transform:translateX(0)}.order-popup img{width:50px;height:50px;border-radius:10px;object-fit:cover}
[dir="ltr"].order-popup{right:auto;left:20px;transform:translateX(-400px)}[dir="ltr"].order-popup.show{transform:translateX(0)}
footer{text-align:center;padding:20px;color:#777;font-size:12px}
</style>
</head>
<body>
<div class="header-top">
<div class="header-left">
<button class="menu-btn" onclick="openMenu()">☰</button>
<div class="clock-wrap">
<div class="analog-clock"><img src="logo.png" alt="RBooSH" class="clock-logo"><div class="hand hour-hand" id="hourHand"></div><div class="hand minute-hand" id="minuteHand"></div><div class="hand second-hand" id="secondHand"></div><div class="clock-center"></div></div>
<div class="date-info"><span class="day-name" id="dayName">السبت</span><span class="date-num" id="dateNum">26 أيلول</span></div>
</div>
</div>
<div class="header-actions"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☀️</button><div class="lang-switch"><button class="lang-btn active" onclick="setLang('ar')">AR</button><button class="lang-btn" onclick="setLang('en')">EN</button><button class="lang-btn" onclick="setLang('ku')">KU</button></div></div>
</div>
<div class="overlay" id="overlay" onclick="closeMenu()"></div>
<div class="sidebar" id="sidebar">
<button style="background:none;border:none;color:var(--text);font-size:28px;float:left;cursor:pointer" onclick="closeMenu()">×</button>
<div class="sidebar-clock-section">
<div class="analog-clock-large"><img src="logo.png" alt="RBooSH" class="clock-logo-large"><div class="hand-large hour-hand-large" id="hourHandLarge"></div><div class="hand-large minute-hand-large" id="minuteHandLarge"></div><div class="hand-large second-hand-large" id="secondHandLarge"></div><div class="clock-center-large"></div></div>
<div class="sidebar-date"><span class="sidebar-day" id="sidebarDay">السبت</span><span class="sidebar-date-num" id="sidebarDate">26 أيلول 2026</span></div>
</div>
<hr class="sidebar-divider">
<h3 class="sidebar-title" id="menu_title">القائمة</h3>
<a href="index.html" id="menu_home">الرئيسية</a><a href="products.html" id="menu_products">المنتجات</a><a href="calculator.html" id="menu_calc">الحاسبة</a>
</div>
<div class="container">
<div class="logo"><img src="logo.png" alt="RBooSH™"></div>
<div class="visitor-counter"><div class="live-dot"></div><span id="counterText"></span></div>
<div class="hero">
<h1 id="hero_title">RBooSH™ للمواد الكهربائية</h1>
<p id="hero_sub">جودة أوروبية - خدمة سريعة - توصيل لكل سوريا والنمسا</p>
</div>
</div>
<div class="order-popup" id="orderPopup"><img id="popupImg" src=""><div style="flex:1"><b id="popupTitle" style="color:#25D366;font-size:13px;display:block"></b><small id="popupDesc" style="color:var(--text2);font-size:11px"></small></div><span style="color:#777;cursor:pointer" onclick="document.getElementById('orderPopup').classList.remove('show')">×</span></div>
<footer>© 2026 RBooSH™</footer>
<script>
let currentLang='ar';
const productsImg=["https://i.postimg.cc/KYjDpfyj/IMG-20260902-WA0081.jpg","https://i.postimg.cc/qvkLy0bm/IMG-20260902-WA0020.jpg","https://i.postimg.cc/PvdzN16d/IMG-20260828-WA0002-1.jpg"];
const data={ar:{gov:["دمشق","حلب","حمص","الحسكة","اللاذقية","طرطوس","حماة","درعا","دير الزور","السويداء","إدلب","الرقة","القامشلي","ريف دمشق"],names:["أحمد","محمد","علي","خالد","حسن","عمر","يوسف","عبدالله","مصطفى","سامر"],ordered:"طلب الآن",ago:"منذ",min:"دقيقة",viewing:"شخص يشاهدون الآن",orders:"طلب اليوم من"},en:{gov:["Damascus","Aleppo","Homs","Hasakah","Latakia","Tartus","Hama","Daraa","Deir Ezzor","Idlib","Raqqa","Qamishli"],names:["Ahmad","Mohammad","Ali","Khaled","Hassan","Omar","Youssef"],ordered:"ordered now",ago:"ago",min:"min",viewing:"people viewing now",orders:"orders today from"},ku:{gov:["Şam","Heleb","Hims","Hesekê","Laziqiye","Tartus","Hama","Dera","Reqqa","Qamişlo"],names:["Ehmed","Mihemed","Elî","Xalid","Hesen","Omer"],ordered:"niha ferman kir",ago:"berî",min:"deqe",viewing:"kes niha temaşe dikin",orders:"ferman îro ji"}};
const translations={ar:{dir:'rtl',menu_title:'القائمة',menu_home:'الرئيسية',menu_products:'المنتجات',menu_calc:'الحاسبة',hero_title:'RBooSH™ للمواد الكهربائية',hero_sub:'جودة أوروبية - خدمة سريعة - توصيل لكل سوريا والنمسا',days:["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"],months:["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"]},en:{dir:'ltr',menu_title:'Menu',menu_home:'Home',menu_products:'Products',menu_calc:'Calculator',hero_title:'RBooSH™ Electrical Materials',hero_sub:'European Quality - Fast Service - Delivery to Syria & Austria',days:["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]},ku:{dir:'ltr',menu_title:'Menu',menu_home:'Mal',menu_products:'Berhem',menu_calc:'Hesabker',hero_title:'RBooSH™ Materyalên Elektrîkê',hero_sub:'Qalîteya Ewropî - Xizmeta Bilez',days:["Yekşem","Duşem","Sêşem","Çarşem","Pêncşem","În","Şemî"],months:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]}};
function toggleTheme(){document.body.classList.toggle('light');let isLight=document.body.classList.contains('light');localStorage.setItem('rboosh_theme', isLight?'light':'dark');document.getElementById('themeBtn').innerText=isLight?'🌙':'☀️';}
(function(){let saved=localStorage.getItem('rboosh_theme');if(saved==='light'){document.body.classList.add('light');document.getElementById('themeBtn').innerText='🌙';}else{document.getElementById('themeBtn').innerText='☀️';}})();
function updateClock(){let now=new Date();let h=now.getHours()%12;let m=now.getMinutes();let s=now.getSeconds();document.getElementById('hourHand').style.transform=`translateX(-50%) rotate(${(h+m/60)*30}deg)`;document.getElementById('minuteHand').style.transform=`translateX(-50%) rotate(${m*6}deg)`;document.getElementById('secondHand').style.transform=`translateX(-50%) rotate(${s*6}deg)`;document.getElementById('hourHandLarge').style.transform=`translateX(-50%) rotate(${(h+m/60)*30}deg)`;document.getElementById('minuteHandLarge').style.transform=`translateX(-50%) rotate(${m*6}deg)`;document.getElementById('secondHandLarge').style.transform=`translateX(-50%) rotate(${s*6}deg)`;let t=translations[currentLang];document.getElementById('dayName').innerText=t.days[now.getDay()];document.getElementById('dateNum').innerText=now.getDate()+" "+t.months[now.getMonth()];document.getElementById('sidebarDay').innerText=t.days[now.getDay()];document.getElementById('sidebarDate').innerText=now.getDate()+" "+t.months[now.getMonth()]+" "+now.getFullYear();}
function setLang(lang){currentLang=lang;const t=translations[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.remove('active'));document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');document.getElementById('menu_title').innerText=t.menu_title;document.getElementById('menu_home').innerText=t.menu_home;document.getElementById('menu_products').innerText=t.menu_products;document.getElementById('menu_calc').innerText=t.menu_calc;document.getElementById('hero_title').innerText=t.hero_title;document.getElementById('hero_sub').innerText=t.hero_sub;updateClock();updateCounter();}
function openMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function updateCounter(){let viewers=Math.floor(Math.random()*80)+120;let orders=Math.floor(Math.random()*15)+22;let g1=data[currentLang].gov[Math.floor(Math.random()*data[currentLang].gov.length)];let g2=data[currentLang].gov[Math.floor(Math.random()*data[currentLang].gov.length)];if(currentLang==='ar') document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.ar.viewing} - ${orders} ${data.ar.orders} ${g1}، ${g2} و باقي المحافظات`;else if(currentLang==='en') document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.en.viewing} - ${orders} ${data.en.orders} ${g1}, ${g2} & others`;else document.getElementById('counterText').innerHTML=`🔥 ${viewers} ${data.ku.viewing} - ${orders} ${data.ku.orders} ${g1}, ${g2} û yên din`;}
setInterval(updateClock,1000);updateClock();
setInterval(updateCounter,4000);
function showPopup(){let d=data[currentLang];let n=d.names[Math.floor(Math.random()*d.names.length)];let g=d.gov[Math.floor(Math.random()*d.gov.length)];let mins=Math.floor(Math.random()*8)+1;let img=productsImg[Math.floor(Math.random()*productsImg.length)];document.getElementById('popupImg').src=img;if(currentLang==='ar'){document.getElementById('popupTitle').innerHTML=`✅ ${n} من ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`طلب كابل كهرباء - ${data.ar.ago} ${mins} ${data.ar.min} ✅`;}else if(currentLang==='en'){document.getElementById('popupTitle').innerHTML=`✅ ${n} from ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`Ordered cable - ${mins} ${d.min} ${d.ago} ✅`;}else{document.getElementById('popupTitle').innerHTML=`✅ ${n} ji ${g} ${d.ordered}`;document.getElementById('popupDesc').innerHTML=`Kablo ferman kir - ${data.ku.ago} ${mins} ${data.ku.min} ✅`; }document.getElementById('orderPopup').classList.add('show');setTimeout(()=>{document.getElementById('orderPopup').classList.remove('show');},4500);}
setTimeout(showPopup,3000);setInterval(showPopup,8500);updateCounter();
</script>
</body>
</html>
