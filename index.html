<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBOOSH - اشترك واتساب</title>
<style>
body{font-family:system-ui;background:#0f0f0f;color:#fff;text-align:center;padding:40px 20px;margin:0}
.card{background:#1e1e1e;padding:30px;border-radius:20px;max-width:400px;margin:auto}
input{padding:14px;width:260px;border-radius:10px;border:0;font-size:18px;text-align:center}
button{padding:14px 28px;border-radius:10px;border:0;background:#25D366;color:#fff;font-size:18px;margin-top:14px;font-weight:bold;width:290px}
#msg{margin-top:15px;color:#25D366;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h1>RBOOSH 🟢</h1>
<p>اشترك برقم واتساب</p>
<input id="phone" placeholder="09XXXXXXXX"><br>
<button onclick="subscribe()">اشتراك واتساب</button>
<p id="msg"></p>
</div>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2pl0A1R6sKFj7-2D-JvludalOdJcjIG6bwTFUDk82AZbypdsfi6Mv_TrXm9SZ0bB5DQ/exec";
async function subscribe(){
  let phone=document.getElementById('phone').value.trim();
  if(!phone){alert("اكتب رقمك");return;}
  document.getElementById('msg').innerText="جاري الاشتراك...";
  await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({phone:phone})});
  document.getElementById('msg').innerText="✅ تم! انحفظ";
  document.getElementById('phone').value="";
}
</script>
</body>
</html>
