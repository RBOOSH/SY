<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RBooSH Abu Suleiman Group</title>
<style>
:root{--bg:#111;--card:#1e1e1e;--text:#fff;--muted:#aaa;--blue:#1877F2;--green:#25D366}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:900px;margin:0 auto;padding:20px}
.header{position:fixed;top:0;left:0;right:0;background:rgba(17,17,17,.9);backdrop-filter:blur(10px);z-index:100;border-bottom:1px solid #222}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 20px}
.logo-text{font-size:24px;font-weight:900;color:var(--blue)}
.hero{padding:100px 20px 40px;text-align:center}
.hero h1{color:var(--blue);font-size:32px}
.card{background:var(--card);border:1px solid #222;border-radius:16px;padding:24px;margin:20px 0}
.btn{padding:14px 20px;border-radius:10px;border:0;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.btn-whatsapp{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;width:100%;font-size:18px}
.btn-calc{background:linear-gradient(135deg,var(--blue),#0a5dc2);color:#fff}
input{padding:14px;width:100%;border-radius:10px;border:1px solid #333;background:#222;color:#fff;font-size:18px;text-align:center}
#msg{margin-top:12px;color:var(--green);font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.product{background:#222;padding:15px;border-radius:12px;text-align:center}
</style>
</head>
<body>
<div class="header"><div class="header-inner"><div class="logo-text">RBOOSH</div><div>SY</div></div></div>

<div class="container">
<div class="hero">
<h1>RBooSH 🟢</h1>
<p style="color:var(--muted)">Abu Suleiman Group - مجموعة أبو سليمان</p>
</div>

<div class="card" style="border:2px solid #25D366">
<h2 style="text-align:center;margin-bottom:10px">اشترك واتساب 📱</h2>
<p style="text-align:center;color:var(--muted);margin-bottom:15px">سجل رقمك ورح توصلك العروض الجديدة</p>
<input id="phone" placeholder="09XXXXXXXX أو 07XXXXXXXX">
<button class="btn btn-whatsapp" style="margin-top:12px" onclick="subscribe()">اشتراك واتساب ✅</button>
<p id="msg" style="text-align:center"></p>
</div>

<div class="card">
<h2>منتجاتنا</h2>
<div class="products">
<div class="product">🔧 منتج 1</div>
<div class="product">🔧 منتج 2</div>
<div class="product">🔧 منتج 3</div>
<div class="product">🔧 منتج 4</div>
</div>
<br>
<a href="products.html" class="btn btn-calc">شوف كل المنتجات</a>
<a href="calculator.html" class="btn" style="background:#333;color:#fff;margin-right:8px">الحاسبة 🧮</a>
</div>

<div class="card" style="text-align:center;color:var(--muted)">
<p>© 2025 RBOOSH - SY</p>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2pl0A1R6sKFj7-2D-JvludalOdJcjIG6bwTFUDk82AZbypdsfi6Mv_TrXm9SZ0bB5DQ/exec";

async function subscribe(){
  let phone=document.getElementById('phone').value.trim();
  if(!phone){alert("اكتب رقمك");return;}
  document.getElementById('msg').innerText="⏳ جاري الاشتراك...";
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:new URLSearchParams({phone:phone})});
    document.getElementById('msg').innerText="✅ تم! انحفظ رقمك بنجاح";
    document.getElementById('phone').value="";
  }catch(e){
    document.getElementById('msg').innerText="✅ تم الاشتراك";
  }
}
</script>
</body>
</html>
